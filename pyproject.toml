[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reolink-timelapse"
version = "0.1.0"
description = "Record and build timelapses from RTSP cameras, across any number of camera setups"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "astral>=3.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
reolink-timelapse = "reolink_timelapse.cli:main"

[tool.setuptools]
packages = ["reolink_timelapse"]
